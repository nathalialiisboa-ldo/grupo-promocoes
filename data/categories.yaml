# Palavras-chave usadas para categorizar produtos automaticamente pelo nome.
# A ordem importa: a primeira categoria cuja lista bater com o nome do produto
# vence (por isso "Eletrônicos de beleza" vem antes de "Beleza e cosméticos",
# já que termos como "escova secadora" precisam ser pegos como eletrônico).
#
# Pode editar/adicionar palavras livremente sem mexer no código.
# Se nenhuma categoria bater, o produto vira "Fora do escopo".

fora_do_escopo: "Fora do escopo"

order:
  - "Eletrônicos de beleza"
  - "Roupas"
  - "Calçados"
  - "Beleza e cosméticos"
  - "Casa e acessórios"

