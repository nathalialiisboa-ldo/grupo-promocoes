# Modelos de texto de divulgação por categoria.
# Cada categoria tem uma lista de "variants" (variações de intro + urgência).
# O app escolhe uma variação diferente por produto (sempre a mesma pro mesmo
# produto, mas variando entre produtos diferentes), pra não ficar tudo com
# a cara idêntica quando vários produtos parecidos aparecem seguidos.
# Edite ou adicione variações livremente, sem mexer em código. O resto do
# texto (preço, kit, cupom, detalhes, marca, link) é montado automaticamente.

"Roupas":
  unidade_kit: "peça"
  variants:
    - intro: "🔥 Arrasou! Essa peça é o que faltava no seu closet"
      urgencia: "✨ Poucas unidades, garanta a sua antes que acabe!"
    - intro: "👗 Visual novo, orçamento baixo, bora aproveitar"
      urgencia: "⏰ Corre que essa promoção não fica disponível por muito tempo!"
    - intro: "✨ Charme que cabe no bolso, essa peça é sucesso"
      urgencia: "🛍️ Estoque acabando, garanta já a sua!"

